<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | Shoiab Mushtaq</title>
  
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    .error-layout {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-family: var(--font-heading);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 1rem;
      position: relative;
    }
    .error-code::after {
      content: '404';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--grad-secondary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.5;
      filter: blur(10px);
      z-index: -1;
    }
  </style>
</head>
<body>



  <!-- Background Mesh -->
  <div class="bg-mesh-container">
    <div class="bg-mesh-glow bg-glow-1"></div>
    <div class="bg-mesh-glow bg-glow-2"></div>
    <div class="bg-mesh-glow bg-glow-3"></div>
  </div>

  <main class="container error-layout">
    <div class="glass-card reveal" style="max-width: 500px; padding: 4rem 2rem;">
      <h1 class="error-code text-gradient">404</h1>
      <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Coordinate Lost in Hyperspace</h2>
      <p style="color:var(--text-secondary); margin-bottom: 2.5rem; font-size: 0.95rem;">The path you are looking for has been moved or doesn't exist. Let's redirect you back to active operations.</p>
      <a href="index.html" class="btn btn-primary">Return to Base</a>
    </div>
  </main>

  <!-- Global scripts -->
  <script src="js/main.js"></script>
</body>
</html>
